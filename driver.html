<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق مندوب التوصيل - كابتن التوصيل</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 25px; }
        .header { background: #0f172a; color: white; padding: 18px 25px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 25px; }
        .driver-card { background: white; padding: 20px; border-radius: 12px; border-left: 6px solid #3b82f6; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .title { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 8px; }
        .row { margin: 6px 0; font-size: 14px; color: #475569; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; background: #dbeafe; color: #1e40af; font-weight: bold; margin: 10px 0; font-size: 13px; }
        .btn { width: 100%; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-pickup { background: #f59e0b; color: white; }
        .btn-pickup:hover { background: #d97706; }
        .btn-deliver { background: #10b981; color: white; }
        .btn-deliver:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🛵 شاشة الكابتن (طلبات التوصيل المتاحة)</h2>
        <span style="color: #38bdf8; font-weight: bold;">الحالة: متصل (Online) 🟢</span>
    </div>

    <div class="grid" id="driverContainer">
        <!-- تظهر الطلبات هنا -->
    </div>

    <script>
        async function loadDriverOrders() {
            const container = document.getElementById('driverContainer');
            try {
                const res = await fetch('http://localhost:5000/api/orders');
                const data = await res.json();

                // تصفية الطلبات: المندوب يهتم فقط بالطلبات الجاهزة أو التي في الطريق للتسليم
                const activeOrders = data.orders.filter(o => 
                    o.status.includes("المندوب") || o.status.includes("الطريق")
                );

                if (activeOrders.length === 0) {
                    container.innerHTML = '<p style="color:#64748b; font-size:16px;">لا توجد وجبات جاهزة للتوصيل في الوقت الحالي... ⏳</p>';
                    return;
                }

                container.innerHTML = '';
                activeOrders.forEach(order => {
                    const isOnTheWay = order.status.includes("الطريق");
                    container.innerHTML += `
                        <div class="driver-card">
                            <div class="title">طلب توصيل #${order.orderId}</div>
                            <div class="row">👤 <b>العميل:</b> ${order.customerName}</div>
                            <div class="row">📞 <b>رقم الهاتف:</b> ${order.phone}</div>
                            <div class="row">🍔 <b>الوجبة:</b> ${order.mealName}</div>
                            <div class="row">📍 <b>عنوان التوصيل:</b> ${order.address}</div>
                            <div class="row">💵 <b>المبلغ المطلوب تحصيله:</b> <b style="color:#16a34a;">${order.totalPrice}</b></div>
                            <div class="badge">${order.status}</div>

                            ${!isOnTheWay ? `
                                <button class="btn btn-pickup" onclick="updateStatus(${order.orderId}, 'المندوب استلم الوجبة وهو في الطريق إليك 🚴‍♂️')">
                                    📦 استلمت الوجبة وبدأت التوصيل
                                </button>
                            ` : `
                                <button class="btn btn-deliver" onclick="updateStatus(${order.orderId}, 'تم تسليم الطلب بنجاح واستلام المبلغ 💵✅')">
                                    ✅ وصلت وسلمت الطلب للزبون
                                </button>
                            `}
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<p style="color:red;">خطأ في الاتصال بالسيرفر.</p>';
            }
        }

        async function updateStatus(orderId, newStatus) {
            await fetch(`http://localhost:5000/api/orders/${orderId}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newStatus })
            });
            loadDriverOrders();
        }

        loadDriverOrders();
        setInterval(loadDriverOrders, 3000); // تحديث تلقائي كل 3 ثوانٍ
    </script>
</body>
</html>
