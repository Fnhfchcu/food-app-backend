<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة تسجيل الدخول والحسابات</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-container { background: #1e293b; padding: 30px; border-radius: 12px; width: 380px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #334155; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #94a3b8; font-weight: bold; }
        .tab.active { color: #38bdf8; border-bottom: 3px solid #38bdf8; }
        label { display: block; margin: 10px 0 5px; font-size: 14px; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #0ea5e9; }
        .result { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; line-height: 1.5; word-break: break-all; }
        .success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #34d399; }
        .error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>🔐 بوابة مستخدمي التطبيق</h2>

    <div class="tabs">
        <div class="tab active" id="loginTabBtn" onclick="switchTab('login')">تسجيل الدخول</div>
        <div class="tab" id="registerTabBtn" onclick="switchTab('register')">إنشاء حساب جديد</div>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div id="loginForm">
        <label>رقم الهاتف:</label>
        <input type="text" id="loginPhone" placeholder="مثال: 0550112233">

        <label>كلمة المرور:</label>
        <input type="password" id="loginPassword" placeholder="••••••••">

        <button onclick="handleLogin()">دخول إلى حسابي 🚀</button>
    </div>

    <!-- نموذج إنشاء حساب جديد -->
    <div id="registerForm" style="display: none;">
        <label>الاسم الكامل:</label>
        <input type="text" id="regName" placeholder="مثال: محمد علي">

        <label>رقم الهاتف:</label>
        <input type="text" id="regPhone" placeholder="مثال: 0550112233">

        <label>كلمة المرور:</label>
        <input type="password" id="regPassword" placeholder="كلمة مرور قوية">

        <label>نوع الحساب (الدور في التطبيق):</label>
        <select id="regRole">
            <option value="customer">زبون (طالب طعام) 👤</option>
            <option value="restaurant">مدير مطعم 👨‍🍳</option>
            <option value="driver">كابتن توصيل 🛵</option>
        </select>

        <button onclick="handleRegister()">إنشاء الحساب الآن ✅</button>
    </div>

    <div id="resBox" class="result"></div>
</div>

<script>
    function switchTab(type) {
        const loginTab = document.getElementById('loginTabBtn');
        const regTab = document.getElementById('registerTabBtn');
        const loginForm = document.getElementById('loginForm');
        const regForm = document.getElementById('registerForm');
        document.getElementById('resBox').style.display = 'none';

        if (type === 'login') {
            loginTab.classList.add('active');
            regTab.classList.remove('active');
            loginForm.style.display = 'block';
            regForm.style.display = 'none';
        } else {
            regTab.classList.add('active');
            loginTab.classList.remove('active');
            regForm.style.display = 'block';
            loginForm.style.display = 'none';
        }
    }

    async function handleRegister() {
        const name = document.getElementById('regName').value;
        const phone = document.getElementById('regPhone').value;
        const password = document.getElementById('regPassword').value;
        const role = document.getElementById('regRole').value;

        const res = await fetch('http://localhost:5000/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, password, role })
        });
        const data = await res.json();
        showResult(data.success, data.message);

        if (data.success) {
            setTimeout(() => switchTab('login'), 1500);
        }
    }

    async function handleLogin() {
        const phone = document.getElementById('loginPhone').value;
        const password = document.getElementById('loginPassword').value;

        const res = await fetch('http://localhost:5000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (data.success) {
            showResult(true, `<b>${data.message}</b><br><b>الدور:</b> ${data.user.role}<br><br><b>رمز التصريح الرقمي (JWT):</b><br><small style="color:#94a3b8;">${data.token.substring(0, 40)}...</small>`);
        } else {
            showResult(false, data.message);
        }
    }

    function showResult(isSuccess, msg) {
        const box = document.getElementById('resBox');
        box.style.display = 'block';
        box.className = 'result ' + (isSuccess ? 'success' : 'error');
        box.innerHTML = msg;
    }
</script>

</body>
</html>
